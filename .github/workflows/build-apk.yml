name: Build Android APK

# Cara pakai:
# 1. Push/upload seluruh isi folder project ini ke sebuah repository GitHub.
# 2. Buka tab "Actions" di repository tersebut, jalankan workflow "Build Android APK"
#    (atau otomatis akan berjalan setiap kali push ke branch main).
# 3. Setelah selesai (~10-15 menit), buka hasil run-nya lalu unduh artifact
#    bernama "roblox-username-detector-apk" pada bagian "Artifacts".
# 4. Ekstrak zip tersebut, di dalamnya ada file app-debug.apk yang siap di-install
#    di HP Android (aktifkan "Install dari sumber tidak dikenal" terlebih dahulu).

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (Vite)
        run: npm run build

      - name: Add Android platform (Capacitor)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11.0"
          sdk-platforms: "android-34"
          sdk-build-tools: "34.0.0"
          sdk-components: "platform-tools"

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        run: find android/app/build/outputs/apk -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-username-detector-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
