name: Build Android APK

# Cara pakai:
# 1. Push/upload seluruh isi folder project ini ke sebuah repository GitHub.
# 2. Buka tab "Actions" di repository tersebut, jalankan workflow "Build Android APK"
#    (atau otomatis akan berjalan setiap kali push ke branch main).
# 3. Setelah selesai (~10-15 menit), buka hasil run-nya lalu unduh artifact
#    bernama "roblox-username-detector-apk" pada bagian "Artifacts".
# 4. Ekstrak zip tersebut, di dalamnya ada file app-debug.apk yang siap di-install
#    di HP Android (aktifkan "Install dari sumber tidak dikenal" terlebih dahulu).

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web app (Vite)
        run: npm run build

      - name: Remove existing Android folder (clean build)
        run: rm -rf android

      - name: Use Capacitor 6 (compatible with Kotlin 1.8.x)
        run: npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Add Android platform (Capacitor 6)
        run: npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12.0"
          packages: "platforms;android-34 build-tools;34.0.0 platform-tools"
          accept-android-sdk-licenses: true

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        run: find android/app/build/outputs/apk -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: roblox-username-detector-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
